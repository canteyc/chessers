[package]
name = "chessers"
version = "0.1.0"
edition = "2021"

[lib]
name = "chessers"
path = "src/lib.rs"

[[bin]]
name = "chessers"
path = "src/main.rs"

[[bin]]
name = "train"
path = "src/train.rs"

[[bin]]
name = "train_scorer"
path = "src/train_scorer.rs"

[dependencies]
candle-core = "0.9.1"
candle-nn = "0.9.1"
chess = "3.2.0"
eframe = "0.27.2"
egui = "0.27.2"
rand = "0.8.5"
chrono = "0.4"
anyhow = "1.0.86"
clap = { version = "4.5.11", features = ["derive"] }
pgn-reader = "0.25.0"
rayon = "1.5.1"
pprof = { version = "0.13", features = ["flamegraph"] }
